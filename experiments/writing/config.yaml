# Writing quality, via m-a-p/Writing-Preference-Bench -- chosen/rejected
# preference pairs across many writing genres, judged by an LLM comparing
# a fresh response against both. See environments/writing/env.py for the
# English-only filtering and why LLM-judge grading is used here.
environment: writing

writing:
  dataset_name: "m-a-p/Writing-Preference-Bench"
  hf_split: "train"          # the dataset's only physical split (1800 rows, ~1200 English-ish)
  split_ranges:
    train: {offset: 0, count: 700}
    valid_seen: {offset: 700, count: 200}
    valid_unseen: {offset: 900}   # count omitted -> rest of the English-filtered pool

experiment:
  seed: 42
  max_steps: 5                          # single-turn task -- always done after step 1; just a safety cap
  num_train_success: 30
  num_train_fail: 30
  max_train_episodes: 300
  num_eval_tasks: 100
  num_dev_tasks: 60
  avo_dev_tasks_per_candidate: 40
  trainer_rounds: 3
  reflact:
    reflact_train_size: 700

paths:
  training_trajectories: "data/training/trajectories.jsonl"
  eval_baseline_trajectories: "data/evaluation/baseline_trajectories.jsonl"
  eval_skill_trajectories: "data/evaluation/skill_trajectories.jsonl"
  skill_dir: "skills"
  skill_file: "skills/SKILL.md"
  initial_skill_file: "skills/SKILL.initial.md"
  trainer_rounds_log: "results/trainer_rounds.json"
  results_summary: "results/summary.json"
  results_table: "results/summary.txt"
