# Generated by convert_conversation.py from a corpus of past conversations.
# `conversation_judge` has no live environment to roll out against -- see
# environments/conversation_judge/env.py for how its validation gate works.
environment: conversation_judge

conversation_judge:
  # Relative to the repo root (not this experiment's directory, unlike the
  # `paths:` section below) -- worker processes have no notion of "this
  # experiment's directory" the way util.resolve_path(env, ...) does for
  # path fields elsewhere, since the environment plugin only ever sees the
  # merged config. environments/conversation_judge/env.py resolves this
  # against util.REPO_ROOT, computed fresh wherever the repo is checked out,
  # so this stays portable across machines instead of baking in a path.
  episodes_path: "experiments/oasst-chat/data/dev_pool.json"
  split_map:
    valid_seen: {offset: 0, count: 24}
    valid_unseen: {offset: 24, count: 23}

experiment:
  seed: 42
  max_steps: 5
  num_dev_tasks: 20
  num_eval_tasks: 23
  avo_dev_tasks_per_candidate: 20
  trainer_rounds: 3

paths:
  training_trajectories: "data/training/trajectories.jsonl"
  eval_baseline_trajectories: "data/evaluation/baseline_trajectories.jsonl"
  eval_skill_trajectories: "data/evaluation/skill_trajectories.jsonl"
  skill_dir: "skills"
  skill_file: "skills/SKILL.md"
  initial_skill_file: "skills/SKILL.initial.md"
  trainer_rounds_log: "results/trainer_rounds.json"
  results_summary: "results/summary.json"
  results_table: "results/summary.txt"
